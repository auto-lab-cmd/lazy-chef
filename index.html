<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFFEF8">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="懒洋洋大厨">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-32.png">
<title>懒洋洋当大厨</title>
<style>
/* ===== CSS Reset & Variables ===== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --white: #FFFFFF;
  --bg: #FFFEF8;
  --bg-warm: #FFF8EC;
  --primary: #FFA62B;
  --primary-light: #FFD4A3;
  --primary-lighter: #FFF0DC;
  --primary-dark: #E8870C;
  --brown: #5C4033;
  --brown-light: #8B6F5C;
  --brown-lighter: #C4A884;
  --text: #2D1B0E;
  --text-secondary: #8B7355;
  --text-light: #B5A088;
  --pink: #FFB6C1;
  --pink-light: #FFDDE3;
  --meat-white: #FBE7D0;
  --gold: #F5C518;
  --gold-light: #FFF3B0;
  --black-soft: #2D1B0E;
  --border: #F0E6D6;
  --shadow-sm: 0 1px 3px rgba(92, 64, 51, 0.06);
  --shadow-md: 0 2px 8px rgba(92, 64, 51, 0.08);
  --shadow-lg: 0 4px 16px rgba(92, 64, 51, 0.12);
  --shadow-primary: 0 4px 14px rgba(255, 166, 43, 0.3);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 18px;
  --radius-xl: 24px;
  --header-h: 64px;
  --nav-h: 58px;
  --max-w: 480px;
}

html { font-size: 16px; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
  background: #F5F0E8;
  color: var(--text);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  line-height: 1.5;
}

#app {
  max-width: var(--max-w);
  margin: 0 auto;
  min-height: 100vh;
  position: relative;
  background: var(--bg);
  background-image:
    radial-gradient(circle at 15% 10%, rgba(255, 166, 43, 0.06) 0%, transparent 40%),
    radial-gradient(circle at 85% 70%, rgba(255, 182, 193, 0.05) 0%, transparent 40%),
    radial-gradient(circle at 50% 95%, rgba(245, 197, 24, 0.04) 0%, transparent 40%);
  box-shadow: 0 0 40px rgba(92, 64, 51, 0.06);
  overflow: hidden;
}

/* ===== Background Decoration ===== */
.bg-deco {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.bg-deco svg {
  position: absolute;
  opacity: 0.025;
}
.bg-deco .deco-1 { top: 120px; right: -20px; width: 100px; transform: rotate(-15deg); }
.bg-deco .deco-2 { bottom: 200px; left: -25px; width: 90px; transform: rotate(20deg); }
.bg-deco .deco-3 { top: 45%; left: 30%; width: 60px; opacity: 0.015; }
.bg-deco .deco-pot { top: 200px; left: -10px; width: 50px; opacity: 0.02; }
.bg-deco .deco-utensil { bottom: 300px; right: -10px; width: 45px; opacity: 0.02; }

/* ===== Header ===== */
.app-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(255, 254, 248, 0.95);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}
.header-content {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: var(--header-h);
  padding: 0 16px;
  position: relative;
}
.header-logo {
  width: 40px;
  height: 44px;
  flex-shrink: 0;
  animation: sheepBounce 3s ease-in-out infinite;
}
.header-logo svg { width: 100%; height: 100%; }
.app-title {
  font-size: 1.25rem;
  font-weight: 800;
  color: var(--brown);
  letter-spacing: 1px;
  text-shadow: 0 1px 2px rgba(255, 166, 43, 0.15);
  white-space: nowrap;
}
.app-title .accent { color: var(--primary); }

@keyframes sheepBounce {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  25% { transform: translateY(-2px) rotate(-2deg); }
  75% { transform: translateY(-1px) rotate(1deg); }
}

/* ===== Main Content ===== */
.app-main {
  position: relative;
  z-index: 1;
  min-height: calc(100vh - var(--header-h) - var(--nav-h));
  padding-bottom: calc(var(--nav-h) + 16px);
}

.page { display: none; }
.page.page-active {
  display: block;
  animation: pageFadeIn 0.3s ease;
}

@keyframes pageFadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== Menu Page ===== */
.search-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 12px 16px 0;
  background: var(--white);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 10px 16px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search-bar:focus-within {
  border-color: var(--primary-light);
  box-shadow: 0 0 0 3px rgba(255, 166, 43, 0.1);
}
.search-bar svg { width: 18px; height: 18px; color: var(--text-light); flex-shrink: 0; }
.search-bar input {
  border: none;
  outline: none;
  background: transparent;
  font-size: 0.95rem;
  color: var(--text);
  width: 100%;
  font-family: inherit;
}
.search-bar input::placeholder { color: var(--text-light); }

.tag-filters {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 12px 16px 4px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.tag-filters::-webkit-scrollbar { display: none; }

.filter-chip {
  flex-shrink: 0;
  padding: 6px 14px;
  border-radius: var(--radius-xl);
  font-size: 0.82rem;
  font-weight: 600;
  border: 1.5px solid var(--border);
  background: var(--white);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
  user-select: none;
}
.filter-chip:active { transform: scale(0.95); }
.filter-chip.active {
  background: var(--primary);
  border-color: var(--primary);
  color: var(--white);
  box-shadow: var(--shadow-primary);
}
.filter-chip.all-active {
  background: var(--brown);
  border-color: var(--brown);
  color: var(--white);
}

.dishes-list {
  padding: 8px 16px 100px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* ===== Dish Card ===== */
.dish-card {
  background: var(--white);
  border-radius: var(--radius-lg);
  padding: 16px;
  box-shadow: var(--shadow-md);
  border: 1px solid var(--border);
  transition: transform 0.15s, box-shadow 0.15s;
  animation: cardSlideIn 0.35s ease backwards;
}
.dish-card:active { transform: scale(0.99); }

@keyframes cardSlideIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.dish-card-top {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 10px;
}
.dish-emoji {
  font-size: 1.6rem;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--primary-lighter);
  border-radius: var(--radius-md);
  flex-shrink: 0;
}
.dish-info { flex: 1; min-width: 0; }
.dish-name {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brown);
  margin-bottom: 6px;
  word-break: break-word;
}
.dish-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.dish-tag {
  font-size: 0.72rem;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 6px;
  white-space: nowrap;
}
.dish-actions {
  display: flex;
  gap: 4px;
  flex-shrink: 0;
}
.action-btn {
  width: 30px;
  height: 30px;
  border: none;
  border-radius: var(--radius-sm);
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.95rem;
  transition: background 0.15s;
}
.action-btn:active { background: var(--primary-lighter); }
.action-btn.edit { color: var(--primary-dark); }
.action-btn.delete { color: #C0392B; opacity: 0.6; }

.dish-ingredients {
  margin-top: 4px;
}
.ingredient-label {
  font-size: 0.75rem;
  color: var(--text-light);
  font-weight: 600;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.ingredient-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.ingredient-chip {
  font-size: 0.78rem;
  padding: 3px 10px;
  border-radius: var(--radius-xl);
  background: var(--bg-warm);
  color: var(--brown-light);
  border: 1px solid var(--border);
}

.video-link {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  padding: 10px 14px;
  border-radius: var(--radius-md);
  text-decoration: none;
  transition: transform 0.15s, opacity 0.15s;
  cursor: pointer;
}
.video-link:active { transform: scale(0.98); opacity: 0.85; }
.video-platform-badge {
  font-size: 0.72rem;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 6px;
  white-space: nowrap;
  flex-shrink: 0;
}
.video-text {
  flex: 1;
  font-size: 0.85rem;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.video-play {
  font-size: 1.1rem;
  flex-shrink: 0;
}

/* Empty State */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 24px;
  text-align: center;
}
.empty-state .empty-sheep {
  width: 100px;
  height: 110px;
  margin-bottom: 16px;
  opacity: 0.5;
}
.empty-state h3 {
  font-size: 1.1rem;
  color: var(--brown);
  margin-bottom: 6px;
}
.empty-state p {
  font-size: 0.88rem;
  color: var(--text-light);
}

/* ===== My Page ===== */
.profile-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 28px 16px 20px;
  background: linear-gradient(180deg, var(--bg-warm) 0%, transparent 100%);
}
.profile-logo {
  width: 90px;
  height: 100px;
  margin-bottom: 8px;
  animation: sheepBounce 3s ease-in-out infinite;
}
.profile-logo svg { width: 100%; height: 100%; }
.profile-title {
  font-size: 1.4rem;
  font-weight: 800;
  color: var(--brown);
  letter-spacing: 1px;
}
.profile-title .accent { color: var(--primary); }
.profile-subtitle {
  font-size: 0.82rem;
  color: var(--text-light);
  margin-top: 2px;
}

.stats-section {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0;
  margin: 0 16px 20px;
  background: var(--white);
  border-radius: var(--radius-lg);
  padding: 16px 24px;
  box-shadow: var(--shadow-md);
  border: 1px solid var(--border);
}
.stat-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1;
}
.stat-num {
  font-size: 1.6rem;
  font-weight: 800;
  color: var(--primary);
  line-height: 1;
}
.stat-label {
  font-size: 0.78rem;
  color: var(--text-secondary);
  margin-top: 4px;
}
.stat-divider {
  width: 1px;
  height: 30px;
  background: var(--border);
  margin: 0 20px;
}

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  margin-bottom: 10px;
  margin-top: 8px;
}
.section-title {
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--brown);
}
.add-btn {
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--primary-dark);
  background: var(--primary-lighter);
  border: none;
  padding: 5px 12px;
  border-radius: var(--radius-xl);
  cursor: pointer;
  transition: all 0.15s;
}
.add-btn:active { transform: scale(0.95); }

.tags-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  padding: 0 16px;
  margin-bottom: 24px;
}
.tag-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 8px 7px 14px;
  border-radius: var(--radius-xl);
  font-size: 0.85rem;
  font-weight: 600;
  box-shadow: var(--shadow-sm);
  animation: tagPop 0.3s ease backwards;
}
@keyframes tagPop {
  from { opacity: 0; transform: scale(0.8); }
  to { opacity: 1; transform: scale(1); }
}
.tag-item .tag-delete {
  width: 20px;
  height: 20px;
  border: none;
  border-radius: 50%;
  background: rgba(255,255,255,0.3);
  color: inherit;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.7rem;
  font-weight: bold;
  transition: background 0.15s;
}
.tag-item .tag-delete:hover { background: rgba(255,255,255,0.5); }
.tag-item .tag-delete:active { transform: scale(0.85); }

.no-tags-hint {
  padding: 20px 16px;
  text-align: center;
  color: var(--text-light);
  font-size: 0.85rem;
}

.settings-list {
  margin: 0 16px 24px;
  background: var(--white);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-md);
  border: 1px solid var(--border);
}
.setting-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 14px 16px;
  border: none;
  border-bottom: 1px solid var(--border);
  background: var(--white);
  font-size: 0.9rem;
  color: var(--text);
  cursor: pointer;
  transition: background 0.15s;
  font-family: inherit;
  text-align: left;
}
.setting-item:last-child { border-bottom: none; }
.setting-item:active { background: var(--bg-warm); }
.setting-item.danger { color: #C0392B; }
.setting-item .setting-arrow {
  color: var(--text-light);
  font-size: 0.8rem;
}

/* ===== FAB ===== */
.fab-wrap {
  position: fixed;
  bottom: calc(var(--nav-h) + 16px);
  right: 20px;
  z-index: 50;
  transition: opacity 0.2s, transform 0.2s;
}
.fab-wrap.hidden {
  opacity: 0;
  pointer-events: none;
  transform: scale(0.8);
}
@media (min-width: 481px) {
  .fab-wrap { right: calc(50% - 220px); }
}
.fab {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  border: none;
  box-shadow: 0 4px 14px rgba(255, 166, 43, 0.4);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.15s;
  animation: fabPulse 2.5s ease-in-out infinite;
}
.fab:active { transform: scale(0.88); }
.fab svg { width: 26px; height: 26px; color: white; }
@keyframes fabPulse {
  0%, 100% { box-shadow: 0 4px 14px rgba(255, 166, 43, 0.4); }
  50% { box-shadow: 0 4px 20px rgba(255, 166, 43, 0.55); }
}

/* ===== Bottom Nav ===== */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: var(--max-w);
  height: var(--nav-h);
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 100;
  box-shadow: 0 -2px 12px rgba(92, 64, 51, 0.06);
}
.nav-item {
  flex: 1;
  border: none;
  background: transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  cursor: pointer;
  color: var(--text-light);
  font-size: 0.72rem;
  font-weight: 600;
  transition: color 0.2s;
  font-family: inherit;
  position: relative;
}
.nav-item svg { width: 22px; height: 22px; transition: transform 0.2s; }
.nav-item.active { color: var(--primary-dark); }
.nav-item.active svg { transform: scale(1.1); }
.nav-item.active::before {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 30px;
  height: 3px;
  border-radius: 0 0 4px 4px;
  background: var(--primary);
}
.nav-item:active { transform: scale(0.95); }

/* ===== Modal ===== */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(45, 27, 14, 0.4);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 200;
  display: none;
  align-items: flex-end;
  justify-content: center;
}
.modal-overlay.active {
  display: flex;
  animation: overlayFadeIn 0.2s ease;
}
@keyframes overlayFadeIn {
  from { background: rgba(45, 27, 14, 0); }
  to { background: rgba(45, 27, 14, 0.4); }
}
.modal-content {
  background: var(--white);
  width: 100%;
  max-width: var(--max-w);
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  max-height: 88vh;
  display: flex;
  flex-direction: column;
  animation: modalSlideUp 0.3s cubic-bezier(0.32, 0.72, 0, 1);
}
@keyframes modalSlideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.modal-content.modal-sm { max-height: 60vh; }

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.modal-header h3 {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--brown);
}
.modal-close {
  width: 30px;
  height: 30px;
  border: none;
  border-radius: 50%;
  background: var(--bg-warm);
  font-size: 1.3rem;
  color: var(--text-secondary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
  transition: background 0.15s;
}
.modal-close:active { background: var(--primary-lighter); }

.modal-body {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 20px;
}

.modal-footer {
  display: flex;
  gap: 12px;
  padding: 12px 20px 20px;
  flex-shrink: 0;
}
.btn-cancel, .btn-save, .btn-danger {
  flex: 1;
  padding: 12px;
  border-radius: var(--radius-md);
  font-size: 0.95rem;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition: transform 0.15s, opacity 0.15s;
  font-family: inherit;
}
.btn-cancel {
  background: var(--bg-warm);
  color: var(--text-secondary);
  border: 1.5px solid var(--border);
}
.btn-save {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: var(--white);
  box-shadow: var(--shadow-primary);
}
.btn-danger {
  background: #E74C3C;
  color: var(--white);
}
.btn-cancel:active, .btn-save:active, .btn-danger:active { transform: scale(0.97); }
.btn-save:disabled { opacity: 0.5; }

/* Form Elements */
.form-group { margin-bottom: 18px; }
.form-group:last-child { margin-bottom: 0; }
.form-group label {
  display: block;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--brown);
  margin-bottom: 8px;
}
.form-input {
  width: 100%;
  padding: 11px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-md);
  font-size: 0.95rem;
  color: var(--text);
  background: var(--white);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  font-family: inherit;
}
.form-input:focus {
  border-color: var(--primary-light);
  box-shadow: 0 0 0 3px rgba(255, 166, 43, 0.1);
}
.form-input::placeholder { color: var(--text-light); }

.ingredient-input-wrap {
  display: flex;
  gap: 8px;
}
.ingredient-input-wrap .form-input { flex: 1; }
.ingredient-add-btn {
  padding: 0 16px;
  border: none;
  border-radius: var(--radius-md);
  background: var(--primary-lighter);
  color: var(--primary-dark);
  font-weight: 600;
  font-size: 0.85rem;
  cursor: pointer;
  transition: background 0.15s;
  white-space: nowrap;
}
.ingredient-add-btn:active { background: var(--primary-light); }

.ingredient-chips-form {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 8px;

/* ===== Data Layer ===== */
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.dishes && parsed.tags) {
        state.data = parsed;
        return;
      }
    }
  } catch(e) { console.warn('Load data failed', e); }
  state.data = JSON.parse(JSON.stringify(DEFAULT_DATA));
  saveData();
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
  } catch(e) { console.warn('Save data failed', e); }
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

/* ===== Video Platform Detection ===== */
function getVideoPlatform(url) {
  if (!url) return null;
  const lower = url.toLowerCase().trim();
  if (lower.includes('douyin.com') || lower.includes('v.douyin.com'))
    return { name: '抖音', bg: '#000000', text: '#FFFFFF', icon: '🎵' };
  if (lower.includes('xiaohongshu.com') || lower.includes('xhslink.com'))
    return { name: '小红书', bg: '#FF2442', text: '#FFFFFF', icon: '📕' };
  if (lower.includes('bilibili.com') || lower.includes('b23.tv'))
    return { name: '哔哩哔哩', bg: '#FB7299', text: '#FFFFFF', icon: '📺' };
  if (lower.includes('youtube.com') || lower.includes('youtu.be'))
    return { name: 'YouTube', bg: '#FF0000', text: '#FFFFFF', icon: '▶️' };
  if (lower.includes('kuaishou.com'))
    return { name: '快手', bg: '#FF4906', text: '#FFFFFF', icon: '🎬' };
  if (lower.includes('weixin.qq.com') || lower.includes('mp.weixin'))
    return { name: '微信视频', bg: '#07C160', text: '#FFFFFF', icon: '💬' };
  return { name: '视频链接', bg: '#5C4033', text: '#FFFFFF', icon: '🔗' };
}

/* ===== Tag helpers ===== */
function getTagById(id) { return state.data.tags.find(t => t.id === id); }
function getTagColor(idx) {
  if (idx == null || idx < 0 || idx >= TAG_COLORS.length) return TAG_COLORS[0];
  return TAG_COLORS[idx];
}

/* ===== Rendering ===== */
function renderHeader() {
  document.getElementById('header-logo').innerHTML = sheepSVG('small');
  document.getElementById('profile-logo').innerHTML = sheepSVG('normal');
}

function renderBgDeco() {
  const deco = document.getElementById('bg-deco');
  deco.innerHTML = `
    <div class="deco-1">${miniSheepSVG()}</div>
    <div class="deco-2">${miniSheepSVG()}</div>
    <div class="deco-3">${miniSheepSVG()}</div>
    <div class="deco-pot">${potSVG()}</div>
    <div class="deco-utensil">${potSVG()}</div>
  `;
}

function renderTagFilters() {
  const container = document.getElementById('tag-filters');
  const allActive = state.selectedTagIds.length === 0;
  let html = `<div class="filter-chip ${allActive ? 'all-active' : ''}" data-tag="all">全部</div>`;
  state.data.tags.forEach(tag => {
    const color = getTagColor(tag.color);
    const isActive = state.selectedTagIds.includes(tag.id);
    const style = isActive
      ? `background:${color.bg};border-color:${color.bg};color:${color.text};box-shadow:0 2px 8px rgba(0,0,0,0.1);`
      : '';
    html += `<div class="filter-chip ${isActive ? 'active' : ''}" data-tag="${tag.id}" style="${style}">${escapeHtml(tag.name)}</div>`;
  });
  container.innerHTML = html;

  container.querySelectorAll('.filter-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const tagId = chip.dataset.tag;
      if (tagId === 'all') {
        state.selectedTagIds = [];
      } else {
        const idx = state.selectedTagIds.indexOf(tagId);
        if (idx >= 0) state.selectedTagIds.splice(idx, 1);
        else state.selectedTagIds.push(tagId);
      }
      renderTagFilters();
      renderDishes();
    });
  });
}

function filterDishes() {
  let dishes = [...state.data.dishes];
  if (state.searchQuery) {
    const q = state.searchQuery.toLowerCase();
    dishes = dishes.filter(d =>
      d.name.toLowerCase().includes(q) ||
      (d.ingredients || []).some(i => i.toLowerCase().includes(q))
    );
  }
  if (state.selectedTagIds.length > 0) {
    dishes = dishes.filter(d =>
      (d.tagIds || []).some(t => state.selectedTagIds.includes(t))
    );
  }
  dishes.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  return dishes;
}

  const container = document.getElementById('dishes-list');
  const dishes = filterDishes();

  if (state.data.dishes.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-sheep">${sheepSVG()}</div>

        <p>点击右下角 + 添加第一道菜吧</p>
      </div>`;
    return;
  }

  if (dishes.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-sheep">${sheepSVG()}</div>
        <h3>没有找到菜品</h3>
        <p>试试其他关键词或标签</p>
      </div>`;
    return;
  }

  container.innerHTML = dishes.map((dish, i) => {
    const tags = (dish.tagIds || []).map(getTagById).filter(Boolean);
    const tagsHtml = tags.map(t => {
      const c = getTagColor(t.color);
      return `<span class="dish-tag" style="background:${c.bg};color:${c.text};">${escapeHtml(t.name)}</span>`;
    }).join('');

    const ingredientsHtml = (dish.ingredients || []).map(ing =>
      `<span class="ingredient-chip">${escapeHtml(ing)}</span>`
    ).join('');

    const platform = dish.videoUrl ? getVideoPlatform(dish.videoUrl) : null;
    const videoHtml = platform ? `
      <a class="video-link" data-url="${escapeHtml(dish.videoUrl)}" style="background:${platform.bg === '#000000' ? '#1a1a1a' : platform.bg};">
        <span class="video-platform-badge" style="background:rgba(255,255,255,0.2);color:${platform.text};">${platform.icon} ${platform.name}</span>
        <span class="video-text" style="color:${platform.text};">点击观看视频教程</span>
        <span class="video-play" style="color:${platform.text};">▶</span>
      </a>` : '';

    const emoji = dish.emoji || '🍳';
    const imageHtml = dish.imageData
      ? `<div class="dish-image" style="background-image:url('${dish.imageData}');"></div>`
      : `<div class="dish-emoji">${emoji}</div>`;

    return `
      <div class="dish-card" data-id="${dish.id}" style="animation-delay:${i * 0.05}s;">
        <div class="dish-card-top">
          ${imageHtml}

            <h3 class="dish-name">${escapeHtml(dish.name)}</h3>
            <div class="dish-tags">${tagsHtml || '<span style="font-size:0.78rem;color:var(--text-light);">无标签</span>'}</div>
          </div>
          <div class="dish-actions">
            <button class="action-btn edit" data-edit="${dish.id}" title="编辑">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
            </button>
            <button class="action-btn delete" data-delete="${dish.id}" title="删除">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
          </div>
        </div>
        ${ingredientsHtml ? `
          <div class="dish-ingredients">
            <div class="ingredient-label">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 0 0-7 7c0 2.5 1.5 4.5 3 5.5V17a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-2.5c1.5-1 3-3 3-5.5a7 7 0 0 0-7-7Z"/><path d="M9 21h6"/></svg>
              食材

      </div>`;
  }).join('');

  // Event delegation for dish card actions
  container.querySelectorAll('[data-edit]').forEach(btn => {
    btn.addEventListener('click', (e) => {

    });
  });

    btn.addEventListener('click', (e) => {
      e.stopPropagation();

      if (dish) {
        showConfirm(
          '删除菜品',
          `确定要删除「${escapeHtml(dish.name)}」吗？`,
          () => {
            state.data.dishes = state.data.dishes.filter(d => d.id !== btn.dataset.delete);
            saveData();
            renderDishes();
            renderStats();
            showToast('已删除菜品', 'success');
          }
        );
      }
    });
  });
  container.querySelectorAll('[data-url]').forEach(link => {
    link.addEventListener('click', (e) => {
      e.stopPropagation();
      const url = link.dataset.url;
      window.open(url, '_blank', 'noopener,noreferrer');
    });
  });
}

function renderTags() {
  const container = document.getElementById('tags-grid');
  if (state.data.tags.length === 0) {
    container.innerHTML = '<div class="no-tags-hint">还没有标签，点击上方添加吧</div>';
    return;
  }
  container.innerHTML = state.data.tags.map((tag, i) => {
    const c = getTagColor(tag.color);
    return `
      <div class="tag-item" style="background:${c.bg};color:${c.text};animation-delay:${i * 0.04}s;">
        <span>${escapeHtml(tag.name)}</span>
        <button class="tag-delete" data-tag-delete="${tag.id}" title="删除标签">&times;</button>
      </div>`;
  }).join('');

  container.querySelectorAll('[data-tag-delete]').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = getTagById(btn.dataset.tagDelete);
      if (!tag) return;
      const dishCount = state.data.dishes.filter(d => (d.tagIds || []).includes(tag.id)).length;
      const msg = dishCount > 0
        ? `标签「${escapeHtml(tag.name)}」被 ${dishCount} 道菜使用，删除后菜品将不再显示该标签。确定删除吗？`
        : `确定要删除标签「${escapeHtml(tag.name)}」吗？`;
      showConfirm('删除标签', msg, () => {
        state.data.tags = state.data.tags.filter(t => t.id !== tag.id);
        state.data.dishes.forEach(d => {
          d.tagIds = (d.tagIds || []).filter(id => id !== tag.id);
        });
        state.selectedTagIds = state.selectedTagIds.filter(id => id !== tag.id);
        saveData();
        renderTags();
        renderTagFilters();
        renderDishes();
        renderStats();
        showToast('已删除标签', 'success');
      });
    });
  });
}

function renderStats() {
  document.getElementById('dish-count').textContent = state.data.dishes.length;
  document.getElementById('tag-count').textContent = state.data.tags.length;
}

function renderAll() {
  renderHeader();
  renderBgDeco();
  renderTagFilters();
  renderDishes();
  renderTags();
  renderStats();
}

/* ===== Page Switching ===== */
function switchPage(page) {
  state.currentPage = page;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('page-active'));
  document.getElementById('page-' + page).classList.add('page-active');

/* ===== Dish Modal ===== */
function openDishModal(dishId) {
  state.editingDishId = dishId || null;
  const modal = document.getElementById('dish-modal');
  const title = document.getElementById('dish-modal-title');

  if (dishId) {
    const dish = state.data.dishes.find(d => d.id === dishId);
    if (!dish) return;
    title.textContent = '编辑菜品';
    document.getElementById('dish-name').value = dish.name || '';
    document.getElementById('dish-video').value = dish.videoUrl || '';
    state.tempIngredients = [...(dish.ingredients || [])];
    state.tempTagIds = [...(dish.tagIds || [])];
    state.tempImageData = dish.imageData || null;
  } else {
    title.textContent = '添加菜品';
    document.getElementById('dish-name').value = '';
    document.getElementById('dish-video').value = '';
    state.tempIngredients = [];
    state.tempTagIds = [];
    state.tempImageData = null;
  }

  renderIngredientChips();
  renderTagSelect();
  updateVideoPreview();
  updateImagePreview();

function closeDishModal() {
  document.getElementById('dish-modal').classList.remove('active');
  state.editingDishId = null;
  state.tempIngredients = [];
  state.tempTagIds = [];
  state.tempImageData = null;
}

/* ===== Image Upload ===== */
function updateImagePreview() {
  const container = document.getElementById('image-preview-container');
  if (state.tempImageData) {
    container.classList.add('has-image');
    container.innerHTML = `<img src="${state.tempImageData}" alt="菜品图片">`;
    const removeBtn = document.createElement('button');
    removeBtn.className = 'image-remove-btn';
    removeBtn.innerHTML = '&times;';
    removeBtn.onclick = (e) => {
      e.stopPropagation();
      state.tempImageData = null;
      updateImagePreview();
    };
    container.appendChild(removeBtn);
  } else {
    container.classList.remove('has-image');
    container.innerHTML = `
      <div class="image-placeholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.5-3.5a2 2 0 0 0-2.8 0L6 21"/></svg>
        <span>点击添加菜品图片</span>
      </div>`;
  }
}

function handleImageUpload(file) {
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) {
    showToast('图片不能超过5MB', 'error');
    return;
  }
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const maxDim = 400;
      let { width, height } = img;
      if (width > height) {
        if (width > maxDim) { height = Math.round(height * maxDim / width); width = maxDim; }
      } else {
        if (height > maxDim) { width = Math.round(width * maxDim / height); height = maxDim; }
      }
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      state.tempImageData = canvas.toDataURL('image/jpeg', 0.7);
      updateImagePreview();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function renderIngredientChips() {
  const container = document.getElementById('ingredient-chips-form');
  container.innerHTML = state.tempIngredients.map((ing, i) =>
    `<div class="ingredient-chip-form">
      <span>${escapeHtml(ing)}</span>
      <button class="chip-remove" data-idx="${i}">&times;</button>
    </div>`
  ).join('');
  container.querySelectorAll('.chip-remove').forEach(btn => {
    btn.addEventListener('click', () => {
      state.tempIngredients.splice(parseInt(btn.dataset.idx), 1);
      renderIngredientChips();
    });
  });
}

function renderTagSelect() {
  const container = document.getElementById('tag-select');
  if (state.data.tags.length === 0) {
    container.innerHTML = '<div class="no-tags-select">还没有标签，去「我的」页面添加吧</div>';
    return;
  }
  container.innerHTML = state.data.tags.map(tag => {
    const c = getTagColor(tag.color);
    const selected = state.tempTagIds.includes(tag.id);
    const style = selected
      ? `background:${c.bg};color:${c.text};border-color:transparent;box-shadow:0 2px 6px rgba(0,0,0,0.1);`
      : '';
    return `<div class="tag-select-chip ${selected ? 'selected' : ''}" data-tag-id="${tag.id}" style="${style}">${escapeHtml(tag.name)}</div>`;
  }).join('');
  container.querySelectorAll('.tag-select-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const id = chip.dataset.tagId;
      const idx = state.tempTagIds.indexOf(id);
      if (idx >= 0) state.tempTagIds.splice(idx, 1);
      else state.tempTagIds.push(id);
      renderTagSelect();
    });
  });
}

function updateVideoPreview() {
  const url = document.getElementById('dish-video').value.trim();
  const preview = document.getElementById('video-platform-preview');
  if (!url) { preview.innerHTML = ''; return; }
  const platform = getVideoPlatform(url);
  if (platform) {
    preview.innerHTML = `<div class="video-preview-badge" style="background:${platform.bg};color:${platform.text};">
      ${platform.icon} ${platform.name} · 链接已识别
    </div>`;
  }
}

function addIngredient() {
  const input = document.getElementById('ingredient-input');
  const val = input.value.trim();
  if (!val) return;
  if (state.tempIngredients.includes(val)) {
    showToast('该食材已添加', 'error');
    return;
  }
  state.tempIngredients.push(val);
  input.value = '';
  renderIngredientChips();
  input.focus();
}

function saveDish() {
  const name = document.getElementById('dish-name').value.trim();
  const videoUrl = document.getElementById('dish-video').value.trim();
  if (!name) {
    showToast('请输入菜品名称', 'error');
    document.getElementById('dish-name').focus();
    return;
  }
  if (state.tempIngredients.length === 0) {
    showToast('请至少添加一种食材', 'error');
    return;
  }

  const dishData = {
    name,
    ingredients: [...state.tempIngredients],
    tagIds: [...state.tempTagIds],
    videoUrl,
    imageData: state.tempImageData,
    emoji: FOOD_EMOJIS[Math.floor(Math.random() * FOOD_EMOJIS.length)]
  };

  if (state.editingDishId) {
    const dish = state.data.dishes.find(d => d.id === state.editingDishId);
    if (dish) {
      Object.assign(dish, dishData);
    }
    showToast('菜品已更新', 'success');
  } else {
    state.data.dishes.push({
      id: uid(),
      ...dishData,
      createdAt: Date.now()
    });
    showToast('菜品已添加', 'success');
  }

  saveData();
  closeDishModal();
  renderDishes();
  renderStats();
}

/* ===== Tag Modal ===== */
function openTagModal() {
  state.selectedColorIdx = Math.floor(Math.random() * TAG_COLORS.length);
  document.getElementById('tag-name').value = '';
  renderColorPicker();
  document.getElementById('tag-modal').classList.add('active');
  setTimeout(() => document.getElementById('tag-name').focus(), 300);
}

function closeTagModal() {
  document.getElementById('tag-modal').classList.remove('active');
}

function renderColorPicker() {
  const container = document.getElementById('color-picker');
  container.innerHTML = TAG_COLORS.map((c, i) =>
    `<div class="color-option ${i === state.selectedColorIdx ? 'selected' : ''}" data-idx="${i}" style="background:${c.bg};" title="${c.name}"></div>`
  ).join('');
  container.querySelectorAll('.color-option').forEach(opt => {
    opt.addEventListener('click', () => {
      state.selectedColorIdx = parseInt(opt.dataset.idx);
      renderColorPicker();
    });
  });
}

function saveTag() {
  const name = document.getElementById('tag-name').value.trim();
  if (!name) {
    showToast('请输入标签名称', 'error');
    return;
  }
  if (state.data.tags.some(t => t.name === name)) {
    showToast('标签名称已存在', 'error');
    return;
  }
  state.data.tags.push({
    id: uid(),
    name,
    color: state.selectedColorIdx
  });
  saveData();
  closeTagModal();
  renderTags();
  renderTagFilters();
  renderStats();
  showToast('标签已添加', 'success');
}

/* ===== Confirm Modal ===== */
function showConfirm(title, message, callback, warningText) {
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-message').innerHTML = message;
  const warnEl = document.getElementById('confirm-warning');
  if (warningText) {
    warnEl.textContent = warningText;
    warnEl.style.display = 'block';
  } else {
    warnEl.style.display = 'none';
  }
  state.confirmCallback = callback;
  document.getElementById('confirm-modal').classList.add('active');
}

function closeConfirm() {
  document.getElementById('confirm-modal').classList.remove('active');
  state.confirmCallback = null;
}

/* ===== Toast ===== */
let toastTimer = null;
function showToast(message, type) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove('show');
  }, 2000);
}

/* ===== Export Data ===== */
function exportData() {
  const dataStr = JSON.stringify(state.data, null, 2);
  const blob = new Blob([dataStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const date = new Date();
  const dateStr = `${date.getFullYear()}${String(date.getMonth()+1).padStart(2,'0')}${String(date.getDate()).padStart(2,'0')}`;
  a.href = url;
  a.download = `懒洋洋当大厨_数据备份_${dateStr}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('数据已导出', 'success');
}

  loadData();

    if (e.target === e.currentTarget) closeDishModal();
  });

  // Tag modal
  document.getElementById('add-tag-btn').addEventListener('click', openTagModal);
  document.getElementById('tag-close').addEventListener('click', closeTagModal);
  document.getElementById('tag-cancel').addEventListener('click', closeTagModal);
  document.getElementById('tag-save').addEventListener('click', saveTag);
  document.getElementById('tag-modal').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeTagModal();
  });

  // Confirm modal
  document.getElementById('confirm-close').addEventListener('click', closeConfirm);
  document.getElementById('confirm-cancel').addEventListener('click', closeConfirm);
  document.getElementById('confirm-ok').addEventListener('click', () => {
    if (state.confirmCallback) state.confirmCallback();
    closeConfirm();
  });
  document.getElementById('confirm-modal').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeConfirm();
  });

  // Search
  document.getElementById('search-input').addEventListener('input', (e) => {
    state.searchQuery = e.target.value;
    renderDishes();
  });

  // Settings
  document.getElementById('export-btn').addEventListener('click', exportData);
  document.getElementById('clear-btn').addEventListener('click', () => {
    showConfirm(
      '清空所有数据',
      '确定要清空所有菜品和标签吗？此操作不可撤销。',
      () => {
        state.data = { dishes: [], tags: [] };
        state.selectedTagIds = [];
        saveData();
        renderAll();
        showToast('所有数据已清空', 'success');
      },
      '⚠️ 所有菜品和标签将被永久删除'
    );
  });

  // Close modals on Escape
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeDishModal();
      closeTagModal();
      closeConfirm();
    }
  });

  // Register Service Worker (PWA offline support)
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
